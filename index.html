<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Paper sheet, red margin rule, ink E: the worked example in 48px. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23fbf7ef%22/><rect x=%2224%22 y=%220%22 width=%222%22 height=%22100%22 fill=%22%23b8311a%22/><text x=%2262%22 y=%2272%22 font-size=%2266%22 font-family=%22Georgia,serif%22 font-weight=%22600%22 text-anchor=%22middle%22 fill=%22%231a1612%22>E</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Practice a spoken mock interview built from your role and your stack, then read it back marked up."
    />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Bricolage Grotesque carries the display voice; Geist does the UI work;
         Geist Mono is reserved for measurement. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>EduNerve AI — mock interviews, marked up</title>

    <!-- Applies the saved theme before first paint so a dark-mode user never
         sees a flash of paper. Mirrors src/context/ThemeContext.jsx. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("edunerve-theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* blocked storage: fall through to paper */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
